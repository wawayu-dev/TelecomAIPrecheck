name: telecom-ai-precheck
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telecom_ai_precheck
      MYSQL_USER: precheck
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D telecom_ai_precheck -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    image: telecom-ai-precheck-backend:${RELEASE_TAG:-local}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/telecom_ai_precheck?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-precheck}
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DEMO_ONE_CLICK_LOGIN: ${DEMO_ONE_CLICK_LOGIN:-true}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?请设置 DEMO_OPERATOR_PASSWORD}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:?请设置 DEMO_REVIEWER_PASSWORD}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD:?请设置 DEMO_AUDITOR_PASSWORD}
      DEMO_HOST_PASSWORD: ${DEMO_HOST_PASSWORD:?请设置 DEMO_HOST_PASSWORD}
      XFYUN_API_KEY: ${XFYUN_API_KEY:-}
      XFYUN_MODEL: ${XFYUN_MODEL:-}
      XFYUN_BASE_URL: ${XFYUN_BASE_URL:-https://maas-api.cn-huabei-1.xf-yun.com}
      XFYUN_COMPLETIONS_PATH: ${XFYUN_COMPLETIONS_PATH:-/v2/chat/completions}
      XFYUN_TIMEOUT_MS: ${XFYUN_TIMEOUT_MS:-30000}
      HOST_EVENT_SOURCE: ${HOST_EVENT_SOURCE:-mock-host}
      PRECHECK_TASK_MAX_ATTEMPTS: ${PRECHECK_TASK_MAX_ATTEMPTS:-3}
      PRECHECK_TASK_RETRY_DELAY_SECONDS: ${PRECHECK_TASK_RETRY_DELAY_SECONDS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: telecom-ai-precheck-frontend:${RELEASE_TAG:-local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
volumes:
  mysql-data:
