name: 基础构建与测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telecom_ai_precheck
          MYSQL_USER: precheck
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUN_MYSQL_TESTS: 'true'
      DB_URL: jdbc:mysql://127.0.0.1:3306/telecom_ai_precheck?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: precheck
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译与测试（含真实 MySQL）
        run: mvn -B -ntp -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/target/ai-precheck-0.1.0-SNAPSHOT.jar
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telecom_ai_precheck
          MYSQL_USER: precheck
          MYSQL_PASSWORD: ci-browser-password
          MYSQL_ROOT_PASSWORD: ci-browser-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: '18081'
      DB_URL: jdbc:mysql://127.0.0.1:3306/telecom_ai_precheck?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: precheck
      DB_PASSWORD: ci-browser-password
      DEMO_OPERATOR_PASSWORD: ci-operator-password
      DEMO_REVIEWER_PASSWORD: ci-reviewer-password
      DEMO_AUDITOR_PASSWORD: ci-auditor-password
      BACKEND_URL: http://127.0.0.1:18081
      # CI 只验证失败转人工，不调用真实付费模型。
      XFYUN_API_KEY: ''
      XFYUN_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend/target
      - name: 启动验收后端
        run: |
          java -jar backend/target/ai-precheck-0.1.0-SNAPSHOT.jar > /tmp/precheck-browser.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/actuator/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/actuator/health
      - run: npm ci
        working-directory: frontend
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
        working-directory: frontend
      - name: 宿主集成与浏览器业务流程
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
