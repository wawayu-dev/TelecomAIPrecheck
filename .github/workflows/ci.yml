name: 版本标签构建与验收
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telecom_ai_precheck
          MYSQL_USER: precheck
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUN_MYSQL_TESTS: 'true'
      DB_URL: jdbc:mysql://127.0.0.1:3306/telecom_ai_precheck?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: precheck
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译与测试（含真实 MySQL）
        run: mvn -B -ntp -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/target/ai-precheck-0.1.0-SNAPSHOT.jar
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telecom_ai_precheck
          MYSQL_USER: precheck
          MYSQL_PASSWORD: ci-browser-password
          MYSQL_ROOT_PASSWORD: ci-browser-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: '18081'
      DB_URL: jdbc:mysql://127.0.0.1:3306/telecom_ai_precheck?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: precheck
      DB_PASSWORD: ci-browser-password
      DEMO_OPERATOR_PASSWORD: ci-operator-password
      DEMO_REVIEWER_PASSWORD: ci-reviewer-password
      DEMO_AUDITOR_PASSWORD: ci-auditor-password
      DEMO_ONE_CLICK_LOGIN: 'true'
      BACKEND_URL: http://127.0.0.1:18081
      # CI 只验证失败转人工，不调用真实付费模型。
      XFYUN_API_KEY: ''
      XFYUN_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend/target
      - name: 启动验收后端
        run: |
          java -jar backend/target/ai-precheck-0.1.0-SNAPSHOT.jar > /tmp/precheck-browser.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/actuator/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/actuator/health
      - run: npm ci
        working-directory: frontend
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
        working-directory: frontend
      - name: 宿主集成与浏览器业务流程
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/

  compose:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MYSQL_PORT: '13307'
      FRONTEND_PORT: '18088'
      DB_USERNAME: precheck
      DB_PASSWORD: ci-compose-password
      MYSQL_ROOT_PASSWORD: ci-compose-root-password
      DEMO_OPERATOR_PASSWORD: ci-operator-password
      DEMO_REVIEWER_PASSWORD: ci-reviewer-password
      DEMO_AUDITOR_PASSWORD: ci-auditor-password
      DEMO_HOST_PASSWORD: ci-host-password
      DEMO_ONE_CLICK_LOGIN: 'true'
      PRECHECK_TASK_MAX_ATTEMPTS: '1'
      XFYUN_API_KEY: ''
      XFYUN_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像（复用 BuildKit 缓存）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: telecom-ai-precheck-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=telecom-precheck-backend
          cache-to: type=gha,mode=max,scope=telecom-precheck-backend
      - name: 构建前端镜像（复用 BuildKit 缓存）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: telecom-ai-precheck-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=telecom-precheck-frontend
          cache-to: type=gha,mode=max,scope=telecom-precheck-frontend
      - name: 校验 Compose 配置
        run: docker compose -f docs/TelecomAIPrecheck/docker-compose.yml config --quiet
      - name: 启动整栈镜像
        run: docker compose -f docs/TelecomAIPrecheck/docker-compose.yml up -d --no-build --wait
      - name: 验证前端、反向代理与后端健康检查
        run: |
          curl -fsS http://127.0.0.1:18088/ >/dev/null
          curl -fsS http://127.0.0.1:18088/actuator/health | grep -q '"status":"UP"'
      - name: 输出容器日志
        if: failure()
        run: docker compose -f docs/TelecomAIPrecheck/docker-compose.yml logs --no-color
      - name: 停止验收环境
        if: always()
        run: docker compose -f docs/TelecomAIPrecheck/docker-compose.yml down -v
