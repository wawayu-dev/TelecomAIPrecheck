spring:
  flyway:
    enabled: false
  application:
    name: telecom-ai-precheck
  profiles:
    default: mock
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
precheck:
  context-provider: ${CONTEXT_PROVIDER:mock}
  xfyun:
    api-key: ${XFYUN_API_KEY:}
    base-url: ${XFYUN_BASE_URL:https://maas-api.cn-huabei-1.xf-yun.com}
    completions-path: ${XFYUN_COMPLETIONS_PATH:/v2/chat/completions}
    model: ${XFYUN_MODEL:}
    timeout-ms: ${XFYUN_TIMEOUT_MS:30000}
