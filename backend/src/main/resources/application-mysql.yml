spring:
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/telecom_ai_precheck?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:precheck}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
precheck:
  context-provider: mysql
  demo-login:
    enabled: ${DEMO_ONE_CLICK_LOGIN:false}
